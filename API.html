<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black min-h-screen flex flex-col items-center p-8">
    <h1 class="text-4xl font-bold text-white mb-6">Tú lista de Pokemones</h1>
    <h2 class="text-2xl font-bold text-white mb-6">¡Empecemos esta aventura pokemón!</h2>
    
    <input type="text" id="searchInput" placeholder="Busca tu Pokémon..." 
        class="border-2 border-green-500 bg-gray-900 text-white rounded-full p-4 w-full max-w-md mb-6 
               focus:outline-none focus:ring-4 focus:ring-green-400 shadow-lg"
        onkeyup="filterPokemon()">
    
    <div id="pokemonList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full max-w-6xl"></div>

    <script src="script.js"></script>
</body>
</html>
