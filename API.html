<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra API de pokemones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="Logo.png" type="image/x-icon">
</head>
<body class="bg-gradient-to-r from-blue-100 to-blue-400 min-h-screen flex flex-col items-center p-8">
    <h1 class="text-4xl font-bold text-white mb-6">Bienvenido a tú lista</h1>
    <h2 class="text-white font-roboto text-2xl mb-4">¡Empecemos esta aventura Pokémon!</h2>
    <input type="text" id="searchInput" placeholder="Busca tu Pokemón..." class="border-2 border-blue-400 rounded-full p-4 w-full max-w-md mb-6 focus:outline-none focus:ring-4 focus:ring-black-700 shadow-xl" onkeyup="filterPokemon()">
    <div id="pokemonList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full max-w-6xl"></div>
    <script src="./API.js"></script>
</body> 
</html>
