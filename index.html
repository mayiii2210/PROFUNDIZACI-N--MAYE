<!DOCTYPE html>
<html>
  <head>
    <title>Repaso Javascript</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="contenedor">
      <button type="button" id="boton" class="boton-efecto">Haz clic</button>
      <h1>Operaciones Matemáticas</h1>
      <label for="num1">Número 1:</label>
      <input type="number" id="num1" placeholder="Ingresa un número" />
      <br />
      <label for="num2">Número 2:</label>
      <input type="number" id="num2" placeholder="Ingresa otro número" />
      <br />
      <label for="operacion">Operación:</label>
      <select id="operacion">
        <option value="sumar">Sumar</option>
        <option value="restar">Restar</option>
        <option value="multiplicar">Multiplicar</option>
        <option value="dividir">Dividir</option>
        <option value="potencia">Potencia</option>
      </select>
      <br /><br />
      <button id="calcular" class="boton-efecto">Calcular</button>
      <h2>Resultado: <span id="resultado">0</span></h2>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
