<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="index.js"></script>
    <title>Rick and Morty Swipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-[#2c2c2c] text-white flex flex-col items-center justify-center h-screen">
    <div class="w-full max-w-md text-center p-4 bg-[#2c2c2c] rounded-3xl">
        <h1 class="text-3xl font-bold mb-4">Rick and Morty Swipe</h1>
        <div id="card-container" class="mb-4"></div>

        <div class="flex justify-between mt-4">
            <button id="dislike-zone" class="bg-red-600 px-6 py-2 rounded-lg text-white text-lg drop-zone">Dislike</button>
            <button id="like-zone" class="bg-green-600 px-6 py-2 rounded-lg text-white text-lg drop-zone">Like</button>
        </div>

        <h2 class="text-2xl mt-6">Character List</h2>
        <ul id="liked-list" class="space-y-2 text-left"></ul>

        <button id="fight" class="mt-6 bg-blue-500 px-6 py-2 rounded-lg text-white text-lg">Battle</button>
    </div>
</body>
<script src="index.js"></script>
</html>
