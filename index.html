<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick & Morty Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-10">
    <div class="w-full max-w-md text-center">
      <h1 class="text-4xl font-extrabold mb-10 text-white drop-shadow-lg px-4 truncate">¡Batalla Rick & Morty!</h1>
      <div id="card-container" class="relative w-full h-96 rounded-2xl border-4 border-gray-700 shadow-2xl bg-gray-900 flex items-center justify-center p-4 transition-transform transform hover:scale-105 perspective">
        <p class="text-xl text-gray-400 animate-pulse">Cargando personajes...</p>
      </div>
      <div class="mt-6 flex space-x-4 justify-center">
        <button id="dislike" class="bg-red-500 px-6 py-2 rounded-xl shadow-md hover:bg-red-600 transition-all transform hover:scale-110 font-semibold text-white">Dislike</button>
        <button id="like" class="bg-green-500 px-6 py-2 rounded-xl shadow-md hover:bg-green-600 transition-all transform hover:scale-110 font-semibold text-white">Like</button>
        <button id="fight" class="bg-blue-500 px-6 py-2 rounded-xl shadow-md hover:bg-blue-600 transition-all transform hover:scale-110 font-semibold text-white">Battle</button>
      </div>
      <div class="mt-10 p-4 bg-gray-800 rounded-xl shadow-lg">
        <h2 class="text-2xl mb-4 text-white font-bold">Liked Characters</h2>
        <ul id="liked-list" class="space-y-2 text-left text-gray-300"></ul>
      </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
